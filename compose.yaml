services:
  postgres:
    image: postgres:17
    container_name: novel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: novel_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U novel -d novel_db"]
      interval: 5s
      timeout: 3s
      retires: 5

volumes:
  postgres_data: